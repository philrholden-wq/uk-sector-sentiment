name: Weekly sentiment collection

on:
  schedule:
    # GitHub cron runs in UTC. 08:00 UTC = 08:00 GMT every Monday
    # (09:00 on UK clocks during British Summer Time).
    # Scheduled runs collect every sector whose file has "include_in_schedule": true.
    - cron: "0 8 * * 1"

  # Adds a "Run workflow" button (Actions tab) with a form for one-off runs and new sectors.
  workflow_dispatch:
    inputs:
      sector:
        description: "Existing sector to run: 'all' for every weekly sector, or a file name from sectors/ (e.g. uk-high-street-banking). Ignored when a new sector name is filled in."
        required: false
        default: "all"
        type: string
      new_sector_name:
        description: "NEW SECTOR (optional). Name, e.g. UK supermarkets"
        required: false
        type: string
      new_brands:
        description: "Brands, comma-separated. Add * to UK-only names, | for aliases. e.g. Tesco*, Sainsbury's*|Sainsburys, Marks & Spencer*|M&S, Aldi, Lidl"
        required: false
        type: string
      new_terms:
        description: "Sector phrases, comma-separated, e.g. supermarket, food shop, grocery prices, self-checkout"
        required: false
        type: string
      new_subreddits:
        description: "Up to 3 UK subreddits for targeted Reddit searches (optional). Default: AskUK, CasualUK"
        required: false
        type: string
      add_to_weekly:
        description: "Add the new sector to the Monday run"
        required: false
        default: true
        type: boolean

permissions:
  contents: write           # needed to commit new data and sector files

concurrency:
  group: sentiment-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Form values are passed as environment variables, never pasted into the
      # shell command, so brand names with quotes or symbols are handled safely.
      - name: Run collector
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '30' }}
          BRAVE_MONTHLY_LIMIT: ${{ vars.BRAVE_MONTHLY_LIMIT || '900' }}
          SECTOR: ${{ inputs.sector || 'all' }}
          NEW_SECTOR_NAME: ${{ inputs.new_sector_name }}
          NEW_BRANDS: ${{ inputs.new_brands }}
          NEW_TERMS: ${{ inputs.new_terms }}
          NEW_SUBREDDITS: ${{ inputs.new_subreddits }}
          ADD_TO_WEEKLY: ${{ inputs.add_to_weekly }}
        run: python collector.py

      # Runs even if one sector failed, so the other sectors' data is still saved.
      - name: Commit new data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ sectors/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: sentiment run $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
