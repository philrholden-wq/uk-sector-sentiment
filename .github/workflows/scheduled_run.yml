name: Weekly sentiment collection

on:
  schedule:
    # GitHub cron runs in UTC. 08:00 UTC = 08:00 GMT every Monday
    # (09:00 on UK clocks during British Summer Time).
    - cron: "0 8 * * 1"
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write           # needed to commit the new CSV back to the repo

concurrency:
  group: sentiment-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}
        run: python collector.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: sentiment run $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
